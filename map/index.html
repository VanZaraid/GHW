<html lang="ru">
<head>

<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<link rel="manifest" href="/site.webmanifest">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHW — Карта</title>
    <style>
        /* ── Переменные тем ── */
        :root {
            --bg:            #fafafa;
            --grid-minor:    #e4e4e4;
            --grid-major:    #d2d2d2;
            --grid-fill:     #fafafa;
            --label-fill:    #111;
            --label-shadow:  #fafafa;
            --hover-fill:    #000;
            --panel-bg:      rgba(255,255,255,0.98);
            --panel-border:  #eee;
            --panel-h2:      #222;
            --panel-p:       #777;
            --panel-close:   #aaa;
            --panel-close-h: #333;
            --panel-line:    #444;
            --btn-bg:        white;
            --btn-hover-bg:  #f8f8f8;
            --btn-color:     #555;
            --btn-shadow:    rgba(0,0,0,0.1);
            --station-stroke: white;
            --transfer-stroke: #222;
            
            /* Навбар */
            --nav-bg:        #ffffff;
            --nav-text:      #555555;
            --nav-hover:     #00b181;
            --nav-shadow:    rgba(0,0,0,0.05);
        }

        body.dark {
            --bg:            #1a1a2e;
            --grid-minor:    #252540;
            --grid-major:    #2e2e50;
            --grid-fill:     #1a1a2e;
            --label-fill:    #e8e8f0;
            --label-shadow:  #1a1a2e;
            --hover-fill:    #ffffff;
            --panel-bg:      rgba(26,26,46,0.97);
            --panel-border:  #2e2e50;
            --panel-h2:      #e8e8f0;
            --panel-p:       #888;
            --panel-close:   #555;
            --panel-close-h: #ccc;
            --panel-line:    #bbb;
            --btn-bg:        #252540;
            --btn-hover-bg:  #2e2e50;
            --btn-color:     #aaa;
            --btn-shadow:    rgba(0,0,0,0.4);
            --station-stroke: #1a1a2e;
            --transfer-stroke: #e8e8f0;
            
            /* Навбар Темный */
            --nav-bg:        #151525;
            --nav-text:      #aaaaaa;
            --nav-hover:     #00b181;
            --nav-shadow:    rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }

        /* ── Навигационная панель ── */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--nav-bg);
            height: 60px;
            width: 100%;
            padding: 0 20px;
            box-shadow: 0 2px 4px var(--nav-shadow);
            z-index: 1000;
            position: fixed;
            top: 0;
            left: 0;
            transition: background-color 0.3s, box-shadow 0.3s, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Смещение наверх при скрытии */
        .navbar.nav-hidden {
            transform: translateY(-100%);
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--nav-text);
            font-size: 15px;
            font-weight: 600;
            transition: color 0.2s ease;
            position: relative;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--nav-hover);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--nav-hover);
            border-radius: 2px;
        }

        .nav-icon {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--nav-text);
            transition: fill 0.2s ease;
        }

        .nav-icon:hover svg {
            fill: #5865F2;
        }

        .auth-button {
            position: absolute;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--nav-hover);
            font-size: 15px;
            font-weight: 600;
        }

        .auth-button svg {
            width: 18px;
            height: 18px;
            fill: var(--nav-hover);
        }

        /* ── Элементы карты ── */
        #map-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: grab;
            position: relative;
            background-color: var(--bg);
            transition: background-color 0.3s;
        }

        #map-container.grabbing { cursor: grabbing; }

        #metro-svg {
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            user-select: none;
            padding-top: 60px; /* Сдвиг карты под высоту навбара */
            box-sizing: border-box;
        }

        .metro-line {
            stroke-width: 11;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke-width 0.2s ease, filter 0.2s ease;
        }

        .station {
            transition: r 0.2s ease, stroke-width 0.2s ease;
        }

        .station-group {
            cursor: pointer;
            pointer-events: bounding-box;
        }

        .station-group:hover .station {
            r: 12 !important;
            stroke-width: 4 !important;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.4));
        }

        .station-group:hover text { fill: var(--hover-fill); }

        .station-label {
            fill: var(--label-fill);
            font-size: 16px;
            font-weight: 700;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .line-highlight {
            stroke-width: 15;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.3));
        }

        #info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 280px;
            display: none;
            z-index: 100;
            border: 1px solid var(--panel-border);
            transition: background-color 0.3s, border-color 0.3s;
        }

        #info-panel h2 { margin-top: 0; margin-bottom: 12px; font-size: 1.3em; color: var(--panel-h2); }
        #info-panel p  { margin: 0 0 12px 0; color: var(--panel-p); font-size: 0.9em; }

        .line-list { list-style: none; padding: 0; margin: 0; }
        .line-item { display: flex; align-items: center; margin-bottom: 10px; }

        .line-color-swatch {
            width: 18px; height: 18px;
            border-radius: 50%;
            margin-right: 12px;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3);
        }
        .line-name { font-weight: 600; color: var(--panel-line); }

        #close-panel {
            position: absolute; top: 15px; right: 15px;
            cursor: pointer; font-size: 1.5em; line-height: 1;
            color: var(--panel-close);
        }
        #close-panel:hover { color: var(--panel-close-h); }

        #controls {
            position: fixed; 
            top: 80px; /* Контролы ниже навбара */
            right: 20px;
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            z-index: 90;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Когда скрывается навбар, контролы плавно поднимаются на его место */
        .navbar.nav-hidden ~ #controls {
            transform: translateY(-60px);
        }
    </style>
</head>
