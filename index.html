<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHW</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-color: #000000;
            --primary-color: #8fd82f;
            --text-hover: #000000;
        }
        body.light-theme {
            --bg-color: #ffffff;
            --primary-color: #000000;
            --text-hover: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            transition: background-color 0.25s ease;
        }
        .controls-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .control-btn {
            background: none;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--primary-color);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--primary-color);
            transition: fill 0.2s ease;
        }
        .control-btn:hover {
            background-color: var(--primary-color);
            color: var(--text-hover);
        }
        .control-btn:hover svg {
            fill: var(--text-hover);
        }
        .top-space {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: calc(50vh + 105px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 160px;
            height: auto;
            display: block;
        }
        .center-block {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 320px;
            padding: 20px;
        }
        .discord-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s ease;
        }
        .discord-link svg {
            width: 42px;
            height: 42px;
            fill: var(--primary-color);
            transition: fill 0.25s ease;
        }
        .discord-link:hover {
            transform: scale(1.05);
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            
        }
        .btn-map {
            display: block;
            text-decoration: none;
            color: var(--primary-color);
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            padding: 16px 24px;
            background-color: var(--bg-color);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-map:hover {
            color: var(--text-hover);
            background-color: var(--primary-color);
            transform: translateY(-2px);
        }
        .btn-map:active {
            transform: translateY(0);
        }
        [data-lang="en"] {
            display: none;
        }
        body.lang-en [data-lang="ru"] {
            display: none;
        }
        body.lang-en [data-lang="en"] {
            display: block;
        }
        @media (max-width: 600px), (max-height: 650px) {
            body {
                height: auto;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                padding: 80px 20px 40px 20px;
                overflow-y: auto;
            }
            .controls-container {
                top: 15px;
                right: 15px;
            }
            .top-space {
                position: static;
                margin-bottom: 30px;
            }
            .logo {
                width: 130px;
            }
            .center-block {
                position: static;
                transform: none;
                padding: 0;
            }
            .btn-map {
                padding: 14px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="controls-container">
        <button class="control-btn" id="langToggle" aria-label="Сменить язык / Change language">
            <span data-lang="ru">EN</span>
            <span data-lang="en">RU</span>
        </button>
        <button class="control-btn" id="themeToggle" aria-label="Сменить тему">
            <svg viewBox="0 0 24 24">
                <path d="M21.75 16.242A9.953 9.953 0 0 1 12 22C6.477 22 2 17.523 2 12c0-4.048 2.408-7.535 5.858-9.143a.75.75 0 0 1 1.006.868A8.003 8.003 0 0 0 19.875 15.24a.75.75 0 0 1 .875 1.002z"/>
            </svg>
        </button>
    </div>

    <div class="top-space">
        <img src="logo_dark.png" alt="logo" class="logo" id="logo">
    </div>

    <div class="center-block">
        <a href="https://discord.gg/cSh87GS5xq" class="discord-link" target="_blank" aria-label="Discord">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.18,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.72-10.93,68.6,68.6,0,0,1-10.64-5.12c.91-.67,1.81-1.37,2.65-2.1a75.22,75.22,0,0,0,72.76,0c.84.73,1.74,1.43,2.65,2.1a68.86,68.86,0,0,1-10.64,5.12,74.74,74.74,0,0,0,6.72,10.93,105.73,105.73,0,0,0,31.05-18.83C130,49.67,123.83,26.83,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.87,46,53.87,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.11,46,96.11,53,91,65.69,84.69,65.69Z"/>
            </svg>
        </a>

        <div class="button-container">
            <a href="/rules" class="btn-map">
                <span data-lang="ru">Правила</span>
                <span data-lang="en">Rules</span>
            </a>
            <a href="http://mc.ghw.su:8127" class="btn-map" target="_blank">
                <span data-lang="ru">Карта</span>
                <span data-lang="en">Map</span>
            </a>
            <a href="/eh" class="btn-map">
                <span data-lang="ru">ВМ</span>
                <span data-lang="en">EH</span>
            </a>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const langToggle = document.getElementById('langToggle');
        const body = document.body;
        const logo = document.getElementById('logo');
        
        const darkLogoSrc = "logo_dark.png";
        const lightLogoSrc = "logo_light.png";

        function updateLogo(isLight) {
            logo.src = isLight ? lightLogoSrc : darkLogoSrc;
        }

        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-theme');
            updateLogo(true);
        } else {
            updateLogo(false);
        }

        themeToggle.addEventListener('click', () => {
            const isLight = body.classList.toggle('light-theme');
            updateLogo(isLight);
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        if (localStorage.getItem('lang') === 'en') {
            body.classList.add('lang-en');
        }

        langToggle.addEventListener('click', () => {
            const isEn = body.classList.toggle('lang-en');
            localStorage.setItem('lang', isEn ? 'en' : 'ru');
        });
    </script>
</body>
</html>
